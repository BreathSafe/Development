<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BreathSafe — Alerts</title>
  <link rel="stylesheet" href="admin.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script defer src="../../config.js"></script>
  <script defer src="../../nav.js"></script>
  <script defer src="admin.js"></script>
</head>
<body data-page="alerts">
<div id="app">
  <header class="topbar">
    <div class="topbar-logo"><img src="../../logo.png" style="height: 32px; width: auto; object-fit: contain;">BreathSafe Admin</div>
    <div class="topbar-right"><div class="live-dot" title="Live data"></div><span style="font-size:11px;color:var(--text3)">Live</span><div class="user-chip"><div class="avatar">A</div><span style="color:var(--text2)">Admin</span></div><button class="btn btn-ghost btn-sm" onclick="logout()">Logout</button></div>
  </header>
  <div class="main">
    <nav class="sidebar"></nav>
    <div class="content">
      <div class="panel-pad">
        <div class="page-header">
          <div class="page-title">System Alerts</div>
          <div class="page-sub">Real-time alerts from ESP32 plus admin and management activity</div>
        </div>
        <div class="card" style="margin-bottom: 16px; background: transparent; border: none;">
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;">
            <div class="alert-tabs" id="alert-tabs" style="display: flex; gap: 8px;">
              <button class="tab-btn active" onclick="setAlertFilter('all', this)">All Feed</button>
              <button class="tab-btn" onclick="setAlertFilter('hardware', this)">📡 Device Alerts</button>
              <button class="tab-btn" onclick="setAlertFilter('sms', this)">📤 SMS Broadcasts</button>
              <button class="tab-btn" onclick="setAlertFilter('user', this)">👤 User Actions</button>
            </div>
            <div style="display: flex; gap: 12px; align-items: center;">
              <div style="display: flex; align-items: center; gap: 6px;">
                <span style="font-size: 11px; color: var(--text3); font-weight: 600; text-transform: uppercase;">Severity:</span>
                <select class="form-input" id="severity-filter" onchange="loadAlerts()" style="width: auto; min-width: 120px; font-size: 12px; padding: 6px 12px; height: 32px; background: var(--bg2);">
                  <option value="all">All Levels</option>
                  <option value="critical">🚨 Critical</option>
                  <option value="warning">⚠️ Warning</option>
                  <option value="info">ℹ️ Information</option>
                </select>
              </div>
              <div style="display: flex; align-items: center; gap: 6px;">
                <span style="font-size: 11px; color: var(--text3); font-weight: 600; text-transform: uppercase;">Sort:</span>
                <select class="form-input" id="alert-sort" onchange="loadAlerts()" style="width: auto; min-width: 120px; font-size: 12px; padding: 6px 12px; height: 32px; background: var(--bg2);">
                  <option value="newest">Newest First</option>
                  <option value="oldest">Oldest First</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <style>
          .alert-tabs .tab-btn {
            background: var(--bg2);
            border: 1px solid var(--border);
            color: var(--text2);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
          }
          .alert-tabs .tab-btn:hover {
            background: var(--bg3);
            border-color: var(--border2);
            color: var(--text);
          }
          .alert-tabs .tab-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
          }
          .cat-badge {
            font-size: 9px;
            text-transform: uppercase;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
            letter-spacing: 0.05em;
          }
        </style>

        <div class="card">
          <div class="card-head">
            <span class="card-title">Activity Timeline</span>
            <div style="display: flex; gap: 8px;">
              <button class="btn btn-ghost btn-sm" onclick="showMarkReadModal()">✔️ Mark all as Read</button>
              <button class="btn btn-ghost btn-sm" onclick="loadAlerts()">🔄 Sync Data</button>
            </div>
          </div>
          <div class="card-body">
            <div class="alert-feed" id="admin-alerts" style="min-height: 500px;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="modal-bg" id="clear-alerts-modal"><div class="modal" style="width:420px;"><div class="modal-head"><span class="modal-title">Confirm Clear Alerts</span><button class="modal-close" onclick="cancelClearAlerts()">✕</button></div><div class="modal-body"><p style="color:var(--text2);line-height:1.6;">This will clear alert history from the dashboard feed. Are you sure you want to continue?</p></div><div class="modal-foot"><button class="btn btn-ghost" onclick="cancelClearAlerts()">Cancel</button><button class="btn btn-danger" onclick="confirmClearAlerts()">Yes, Clear Alerts</button></div></div></div>
</body>
</html>
