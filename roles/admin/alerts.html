<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AirWatch — Alerts</title>
  <link rel="stylesheet" href="admin.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script defer src="../../config.js"></script>
  <script defer src="../../nav.js"></script>
  <script defer src="admin.js"></script>
</head>
<body data-page="alerts">
<div id="app">
  <header class="topbar">
    <div class="topbar-logo"><img src="../../logo.png" style="height: 32px; width: auto; object-fit: contain;">AirWatch Admin</div>
    <div class="topbar-right"><div class="live-dot" title="Live data"></div><span style="font-size:11px;color:var(--text3)">Live</span><div class="user-chip"><div class="avatar">A</div><span style="color:var(--text2)">Admin</span></div><button class="btn btn-ghost btn-sm" onclick="logout()">Logout</button></div>
  </header>
  <div class="main">
    <nav class="sidebar"></nav>
    <div class="content">
      <div class="panel-pad">
        <div class="page-header"><div class="page-title">System Alerts</div><div class="page-sub">Real-time alerts from Arduino plus admin and management activity</div></div>
        <div class="card"><div class="card-head"><span class="card-title">Alert History</span><button class="btn btn-ghost btn-sm" onclick="showClearAlertsModal()">Clear All</button></div><div class="card-body"><div class="alert-feed" id="admin-alerts"></div></div></div>
      </div>
    </div>
  </div>
</div>
<div class="modal-bg" id="clear-alerts-modal"><div class="modal" style="width:420px;"><div class="modal-head"><span class="modal-title">Confirm Clear Alerts</span><button class="modal-close" onclick="cancelClearAlerts()">✕</button></div><div class="modal-body"><p style="color:var(--text2);line-height:1.6;">This will clear alert history from the dashboard feed. Are you sure you want to continue?</p></div><div class="modal-foot"><button class="btn btn-ghost" onclick="cancelClearAlerts()">Cancel</button><button class="btn btn-danger" onclick="confirmClearAlerts()">Yes, Clear Alerts</button></div></div></div>
</body>
</html>
